[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Keep pedantic on at "warn" so new pedantic findings still show up locally,
# but disable the specific pedantic + style lints that newer clippy releases
# (1.95+) added and that the existing codebase has many of. Re-enabling these
# would mean editing hundreds of lines of unrelated code; we keep correctness
# and suspicious lints fully enforced.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# Style / readability nits — large diff to fix, no behavioral impact.
doc_markdown = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
redundant_closure_for_method_calls = "allow"
needless_return = "allow"
unnested_or_patterns = "allow"
manual_string_new = "allow"
manual_is_multiple_of = "allow"
map_unwrap_or = "allow"
unnecessary_map_or = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_semicolon = "allow"
unnecessary_trailing_comma = "allow"
unreadable_literal = "allow"
useless_format = "allow"
write_with_newline = "allow"
format_push_string = "allow"
manual_checked_ops = "allow"
# Casts: the codebase deliberately downcasts in many places (e.g. percentage
# rendering, terminal sizing). Suppressing globally rather than annotating
# every site.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# `Result<_, E>` where `E` is bulky — fine here, the error path is rare.
result_large_err = "allow"
# `Duration::from_secs(60 * 60)` etc — readable as-is.
duration_suboptimal_units = "allow"
# `Vec<(K, V)>` returns common in this codebase.
type_complexity = "allow"
# `if let Err(_) = …` is sometimes clearer than `.is_err()`.
redundant_pattern_matching = "allow"
# `manual_split_once` rewrites `splitn(2, …).nth(1)` style code that is
# already idiomatic in this codebase.
manual_split_once = "allow"
# `unnecessary_wraps` requires reorganizing call sites; keep allow.
unnecessary_wraps = "allow"
